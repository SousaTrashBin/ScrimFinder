apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: scrimfinder
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: ^4
    helm:
      releaseName: grafana-k8s-monitoring
      valuesObject:
        cluster:
          name: {{ .Values.global.clusterName }}
        destinations:
          grafana-cloud-metrics:
            type: prometheus
            url: https://prometheus-prod-68-prod-eu-west-6.grafana.net./api/prom/push
            auth:
              type: basic
              username: "3144210"
              password: {{ .Values.secrets.grafanaToken }}
          grafana-cloud-logs:
            type: loki
            url: https://logs-prod-043.grafana.net./loki/api/v1/push
            auth:
              type: basic
              username: "1567780"
              password: {{ .Values.secrets.grafanaToken }}
          gc-otlp-endpoint:
            type: otlp
            url: https://otlp-gateway-prod-eu-west-6.grafana.net./otlp
            protocol: http
            auth:
              type: basic
              username: "1609991"
              password: {{ .Values.secrets.grafanaToken }}
            metrics:
              enabled: true
            logs:
              enabled: true
            traces:
              enabled: true
          grafana-cloud-profiles:
            type: pyroscope
            url: https://profiles-prod-029.grafana.net.:443
            auth:
              type: basic
              username: "1609991"
              password: {{ .Values.secrets.grafanaToken }}
        clusterMetrics:
          enabled: true
          collector: alloy-metrics
        hostMetrics:
          enabled: true
          collector: alloy-metrics
          linuxHosts:
            enabled: true
          windowsHosts:
            enabled: true
          energyMetrics:
            enabled: true
        costMetrics:
          enabled: true
          collector: alloy-metrics
        clusterEvents:
          enabled: true
          collector: alloy-singleton
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
        applicationObservability:
          enabled: true
          collector: alloy-receiver
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411
        autoInstrumentation:
          enabled: true
          collector: alloy-metrics
          beyla:
            deliverTracesToApplicationObservability: false
        profiling:
          enabled: true
          collector: alloy-profiles
          ebpf:
            enabled: true
        collectors:
          alloy-metrics:
            presets:
              - clustered
              - statefulset
          alloy-singleton:
            presets:
              - singleton
          alloy-logs:
            presets:
              - filesystem-log-reader
              - daemonset
          alloy-receiver:
            presets:
              - deployment
          alloy-profiles:
            presets:
              - privileged
              - daemonset
        collectorCommon:
          alloy:
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-029.grafana.net
              auth:
                type: basic
                username: "1609991"
                password: {{ .Values.secrets.grafanaToken }}
        telemetryServices:
          kube-state-metrics:
            deploy: true
          node-exporter:
            deploy: true
          windows-exporter:
            deploy: true
          opencost:
            deploy: true
            metricsSource: grafana-cloud-metrics
            opencost:
              exporter:
                defaultClusterId: {{ .Values.global.clusterName }}
              prometheus:
                existingSecretName: grafana-cloud-metrics-grafana-k8s-monitoring
                external:
                  url: https://prometheus-prod-68-prod-eu-west-6.grafana.net./api/prom
          kepler:
            deploy: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
